services:
  main-service-db:
    image: postgres:16.1
    container_name: postgres-main-service-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: main-service
      POSTGRES_PASSWORD: main-service
      POSTGRES_DB: main-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main-service -d main-service" ]
      interval: 5s
      timeout: 5s
      retries: 10

  stats-db:
    image: postgres:16.1
    container_name: postgres-stats-db
    ports:
      - "6435:5432"
    environment:
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
      POSTGRES_DB: stats
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats -d stats" ]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:16.1
    container_name: postgres-user-db
    ports:
      - "7435:5432"
    environment:
      POSTGRES_USER: user-service
      POSTGRES_PASSWORD: user-service
      POSTGRES_DB: user-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user-service -d user-service" ]
      interval: 5s
      timeout: 5s
      retries: 10

  request-db:
    image: postgres:16.1
    container_name: postgres-request-db
    ports:
      - "8435:5432"
    environment:
      POSTGRES_USER: request-service
      POSTGRES_PASSWORD: request-service
      POSTGRES_DB: request-service
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U request-service -d request-service" ]
      interval: 5s
      timeout: 5s
      retries: 10