syntax = "proto3";

package stats.services.collector;

import "google/protobuf/empty.proto";
import "stats/messages/collector/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.stats.action";

service UserActionController {
    rpc CollectUserAction (messages.collector.UserActionProto)
        returns (google.protobuf.Empty);
}