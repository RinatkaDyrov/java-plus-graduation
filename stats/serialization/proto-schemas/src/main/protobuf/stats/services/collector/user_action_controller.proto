syntax = "proto3";

package stats.service.collector;

import "google/protobuf/empty.proto";
import "stats/messages/collector/user_action.proto";

option java_multiple_files = true;
option java_package = "ru.yandex.practicum.grpc.stats.action";        //проверить надо будет

service UserActionController {
    rpc CollectionUserAction (stats.message.userAction.UserActionProto)
        returns (google.protobuf.Empty);
}