logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty: DEBUG
    org.springframework.web.server: DEBUG

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
          #user service
        - id: user-service-admin
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**
          #request service
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/events/{eventId}/requests
          #event service
        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**
        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**
        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/events/**, /categories/**, /compilations/**
        - id: categories-admin-service
          uri: lb://event-service
          predicates:
            - Path=/admin/categories/**
        - id: compilation-admin-service
          uri: lb://event-service
          predicates:
            - Path=/admin/compilations/**
        - id: comment-service-admin
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**
        - id: comment-service-user
          uri: lb://comment-service
          predicates:
            - Path=/users/{userId}/comments/**
        - id: comment-service-public
          uri: lb://comment-service
          predicates:
            - Path=/comments/**